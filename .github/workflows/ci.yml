name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck (bash scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          find plugins -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck -x

  manifest-validate:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate all plugin.json + hooks.json files
        run: |
          python - <<'PY'
          import json, sys, pathlib
          errors = []
          for p in pathlib.Path("plugins").rglob("*.json"):
              try:
                  json.loads(p.read_text())
              except Exception as e:
                  errors.append(f"{p}: {e}")
          marketplace = pathlib.Path(".claude-plugin/marketplace.json")
          if marketplace.exists():
              try:
                  json.loads(marketplace.read_text())
              except Exception as e:
                  errors.append(f"{marketplace}: {e}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("All JSON manifests valid.")
          PY

  plugin-tests:
    name: Plugin tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - name: Run humanbound-test pytest suite
        working-directory: plugins/humanbound-test
        run: |
          if [ -d tests/python ]; then
            pytest tests/python -v
          else
            echo "no pytest suite — skipping"
          fi
      - name: Install bats
        run: sudo apt-get install -y bats
      - name: Run humanbound-test bats suite
        working-directory: plugins/humanbound-test
        run: |
          if [ -d tests/bash ]; then
            bats tests/bash
          else
            echo "no bats suite — skipping"
          fi
